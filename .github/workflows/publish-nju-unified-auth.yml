name: Publish nju-unified-auth

on:
  push:
    tags:
      - "nju-unified-auth-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish crate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag and package version
        id: package
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#nju-unified-auth-v}"
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "nju-unified-auth") | .version')"
          if [ "${tag_version}" != "${package_version}" ]; then
            echo "tag version ${tag_version} does not match package version ${package_version}" >&2
            exit 1
          fi

          if curl --fail --silent --show-error \
            "https://crates.io/api/v1/crates/nju-unified-auth/${package_version}" \
            >/dev/null; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Authenticate with crates.io
        if: steps.package.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish nju-unified-auth
        if: steps.package.outputs.published != 'true'
        run: cargo publish -p nju-unified-auth
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Report existing release
        if: steps.package.outputs.published == 'true'
        run: echo "nju-unified-auth ${GITHUB_REF_NAME#nju-unified-auth-v} is already published"
