name: Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-nix:
    name: Build ${{ matrix.name }} with Nix
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-4vcpu-ubuntu-2404
            name: linux-x86_64
            package: nju-cli-static
            artifact: nju-cli-linux-x86_64.tar.gz
          - os: blacksmith-4vcpu-ubuntu-2404-arm
            name: linux-aarch64
            package: nju-cli-static
            artifact: nju-cli-linux-aarch64.tar.gz
          - os: blacksmith-6vcpu-macos-15
            name: macos-aarch64
            package: nju-cli
            artifact: nju-cli-macos-aarch64.tar.gz

    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          trust-runner-user: true

      - name: Build nju-cli
        run: nix build --accept-flake-config ".#${{ matrix.package }}"

      - name: Push to Nix binary cache
        if: runner.os == 'Linux'
        env:
          ORANC_USERNAME: ${{ github.actor }}
          ORANC_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          ORANC_SIGNING_KEY: ${{ secrets.ORANC_SIGNING_KEY }}
          NIX_CONFIG: |
            extra-substituters = https://oranc.li7g.com/ghcr.io/linyinfeng/oranc-cache https://linyinfeng.cachix.org
            extra-trusted-public-keys = oranc-linyinfeng-1:rNZCqhG6QTAImDxPI5ydlG5EhLxrwBb11fgpt5zYkVY= linyinfeng.cachix.org-1:sPYQXcNrnCf7Vr7T0YmjXz5dMZ7aOKG3EqLja0xr9MM=
        run: |
          if [ -z "${ORANC_SIGNING_KEY}" ]; then
            echo "ORANC_SIGNING_KEY is not set; skip Nix cache push."
            exit 0
          fi

          out="$(readlink -f result)"
          sudo chmod o+w /nix/var/nix/db

          nix run github:linyinfeng/oranc#oranc -- \
            push \
            --registry ghcr.io \
            --repository nju-cli/nju-cli \
            initialize
          printf '%s\n' "${out}" | nix run github:linyinfeng/oranc#oranc -- \
            push \
            --registry ghcr.io \
            --repository nju-cli/nju-cli

      - name: Package binary
        run: |
          mkdir -p dist
          tar -C result/bin -czf "dist/${{ matrix.artifact }}" nju-cli

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  build-windows:
    name: Build windows-x86_64 with Cargo
    runs-on: blacksmith-4vcpu-windows-2025

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-cli-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-cli-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-release-cli-

      - name: Build nju-cli
        run: cargo build --locked --release -p cli

      - name: Package binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/nju-cli.exe -DestinationPath dist/nju-cli-windows-x86_64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: nju-cli-windows-x86_64.zip
          path: dist/nju-cli-windows-x86_64.zip
          if-no-files-found: error

  package-skills:
    name: Package skills
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v6

      - name: Package nju-cli skills
        run: |
          mkdir -p dist
          tar -czf dist/nju-cli-skills.tar.gz nju-cli-skills

      - uses: actions/upload-artifact@v7
        with:
          name: nju-cli-skills.tar.gz
          path: dist/nju-cli-skills.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - build-nix
      - build-windows
      - package-skills
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release-version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            base_tag=""
            while IFS= read -r candidate; do
              if [[ "${candidate}" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
                base_tag="${candidate}"
                break
              fi
            done < <(git tag --list 'v[0-9]*' --sort=-version:refname)

            if [ -z "${base_tag}" ]; then
              echo "No stable version tag (for example v1.7.2) was found." >&2
              exit 1
            fi

            short_sha="$(git rev-parse --short=5 "${GITHUB_SHA}")"
            release_tag="${base_tag}-${short_sha}"
          fi

          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${release_tag}"

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ steps.release-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release-version.outputs.tag }}
          body: Automated nju-cli release.
          prerelease: ${{ github.ref == 'refs/heads/main' }}

      - name: Sync binaries into Codex marketplace
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "MARKETPLACE_SYNC_TOKEN is not set; skip marketplace sync trigger."
            exit 0
          fi
          gh workflow run sync-cli-binaries.yml \
            --repo nju-cli/codex-marketplace \
            --ref main \
            -f release_tag="${RELEASE_TAG}"

      - name: Sync binaries into Claude Cowork marketplace
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "MARKETPLACE_SYNC_TOKEN is not set; skip Claude marketplace sync trigger."
            exit 0
          fi
          gh workflow run sync-cli-binaries.yml \
            --repo nju-cli/claude-marketplace \
            --ref main \
            -f release_tag="${RELEASE_TAG}"

      - name: Sync binaries into OpenCode npm package
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "MARKETPLACE_SYNC_TOKEN is not set; skip OpenCode package sync trigger."
            exit 0
          fi
          gh workflow run sync-cli-binaries.yml \
            --repo nju-cli/opencode-nju-cli \
            --ref main \
            -f release_tag="${RELEASE_TAG}"
