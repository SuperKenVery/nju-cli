name: Publish nju-web-vpn

on:
  push:
    tags:
      - "nju-web-vpn-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish crate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          trust-runner-user: true

      - name: Check tag and package version
        id: package
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#nju-web-vpn-v}"
          package_version="$(nix develop --accept-flake-config -c cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "nju-web-vpn") | .version')"
          if [ "${tag_version}" != "${package_version}" ]; then
            echo "tag version ${tag_version} does not match package version ${package_version}" >&2
            exit 1
          fi

          if curl --fail --silent --show-error \
            "https://crates.io/api/v1/crates/nju-web-vpn/${package_version}" \
            >/dev/null; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build nju-web-vpn with Nix
        run: nix build --accept-flake-config .#nju-web-vpn

      - name: Package nju-web-vpn
        run: nix develop --accept-flake-config -c cargo package -p nju-web-vpn

      - name: Authenticate with crates.io
        if: steps.package.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish nju-web-vpn
        if: steps.package.outputs.published != 'true'
        run: nix develop --accept-flake-config -c cargo publish -p nju-web-vpn
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Report existing release
        if: steps.package.outputs.published == 'true'
        run: echo "nju-web-vpn ${GITHUB_REF_NAME#nju-web-vpn-v} is already published"
