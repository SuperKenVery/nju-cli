[package]
name = "nju-web-vpn"
version = "0.1.0"
edition.workspace = true
description = "Clientless access to Nanjing University Web VPN resources"
license = "MIT"
repository = "https://github.com/nju-cli/nju-cli"
homepage = "https://github.com/nju-cli/nju-cli"
documentation = "https://docs.rs/nju-web-vpn"
readme = "README.md"
keywords = ["nju", "web-vpn", "atrust", "ztna", "authentication"]
categories = ["authentication", "web-programming::http-client"]
include = ["src/**", "README.md", "LICENSE"]

[package.metadata.docs.rs]
rustdoc-args = ["--deny", "warnings"]

[dependencies]
anyhow = "1"
cookie_store = "0.22"
rand = "0.9"
reqwest = { workspace = true, features = ["cookies", "json"] }
reqwest_cookie_store = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { workspace = true }
