[package]
name = "nju-unified-auth"
version = "0.1.0"
edition.workspace = true
description = "Login helpers for Nanjing University's unified authentication service"
license = "MIT"
repository = "https://github.com/nju-cli/nju-cli"
homepage = "https://github.com/nju-cli/nju-cli"
readme = "README.md"
keywords = ["nju", "authentication", "cas", "sso"]
categories = ["authentication"]
include = ["src/**", "tests/**", "README.md", "LICENSE"]

[dependencies]
aes = "0.8"
anyhow = "1"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
ddddocr = { package = "ddddocr-tract", version = "0.1", default-features = false }
reqwest = { workspace = true, features = ["cookies"] }
scraper = "0.24"

[dev-dependencies]
dotenv = "0.15"
tokio = { workspace = true, features = ["macros", "rt"] }
