[package]
name = "nju-unified-auth"
version = "0.1.0"
edition.workspace = true
description = "Login helpers for Nanjing University's unified authentication service"
license = "MIT"
repository = "https://github.com/nju-cli/nju-cli"
homepage = "https://github.com/nju-cli/nju-cli"
readme = "README.md"
keywords = ["nju", "authentication", "cas", "sso"]
categories = ["authentication"]
include = ["src/**", "tests/*.rs", "README.md", "LICENSE"]

[dependencies]
aes = "0.8"
anyhow = "1"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
ddddocr = { package = "ddddocr-tract", version = "0.1", default-features = false }
image = "0.25"
platform-dirs = "0.3"
rand = "0.9"
reqwest = { workspace = true, features = ["cookies", "json"] }
reqwest_cookie_store = "0.9.0"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
